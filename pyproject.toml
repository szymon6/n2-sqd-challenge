[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n2sqd"
version = "0.1.0"
description = "N2 ground-state energy with sample-based quantum diagonalization (Qiskit Fall Fest 2026 Warsaw, Lab 4b bonus)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pyscf>=2.9",
    "qiskit>=2.0",
    "qiskit-addon-sqd>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "qfest-grader>=0.3.0"]
sim = ["qiskit-aer>=0.17", "ffsim>=0.0.60", "qiskit-ibm-runtime>=0.40"]
ref = ["block2>=0.5.4"]
notebooks = ["jupyter", "matplotlib", "ipykernel"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["n2sqd", "eval"]

[tool.pytest.ini_options]
testpaths = ["src/eval/tests", "src/n2sqd/tests"]
addopts = "-ra --cov=src --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["src/*/tests/*"]
